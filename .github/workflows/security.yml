name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Dependency advisories appear after a commit lands, so re-scan weekly.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip pip-audit

      - name: pip-audit
        run: pip-audit --requirement requirements.txt --strict --progress-spinner off
        continue-on-error: true

      - name: pip-audit (SARIF for code scanning)
        run: pip-audit --requirement requirements.txt --format sarif --output pip-audit.sarif || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit
          path: pip-audit.sarif
          if-no-files-found: ignore

  code:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip bandit

      - name: Bandit
        # Excludes tests: assert statements there are intentional.
        run: bandit -r . -x ./tests,./.venv,./frontend -ll -f screen

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
