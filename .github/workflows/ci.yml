name: CI

# Replaces the previous ci-cd.yml, which had two defects that made it
# ineffective:
#   * `python_version:` (underscore) is not an input of actions/setup-python.
#     The typo was ignored, so the job silently ran on the runner default.
#   * `actions/setup-docker-action@v1` does not exist. It was masked by
#     `continue-on-error: true`, so the Docker stage never really validated.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install tooling
        run: python -m pip install --upgrade pip ruff mypy

      - name: Ruff (lint)
        run: ruff check . --output-format=github

      - name: Ruff (format check)
        run: ruff format --check .

      - name: mypy
        # Not yet clean across the agent modules; surfaced but non-blocking.
        run: mypy config observability utils api --ignore-missing-imports
        continue-on-error: true

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # Redis is reachable here, so the cache regression tests execute
        # rather than skip. That matters: the defect they cover only appears
        # when Redis is available.
        env:
          ENVIRONMENT: testing
          API_SECRET_KEY: ci-test-secret-not-real
          OPENAI_API_KEY: sk-test-placeholder
          USE_MOCK_INTEGRATIONS: "true"
          TEST_REDIS_URL: redis://localhost:6379/15
        run: pytest --cov=. --cov-report=term-missing --cov-report=xml

      - name: Fail if the Redis-backed tests were skipped
        env:
          TEST_REDIS_URL: redis://localhost:6379/15
          ENVIRONMENT: testing
          API_SECRET_KEY: ci-test-secret-not-real
          OPENAI_API_KEY: sk-test-placeholder
        run: |
          out=$(pytest tests/unit/test_cache.py -q 2>&1 | tail -2)
          echo "$out"
          if echo "$out" | grep -q "skipped"; then
            echo "::error::Cache tests skipped in CI - Redis service is not reachable."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: salesiq-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container starts and answers /health
        run: |
          docker run -d --name salesiq-ci -p 8000:8000 \
            -e ENVIRONMENT=development \
            -e API_SECRET_KEY=ci-secret \
            -e OPENAI_API_KEY=sk-test \
            salesiq-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"
              curl -fsS http://localhost:8000/health
              exit 0
            fi
            sleep 1
          done
          echo "::error::container did not become healthy"
          docker logs salesiq-ci
          exit 1

      - name: Confirm the image does not run as root
        run: |
          user=$(docker run --rm --entrypoint sh salesiq-api:ci -c 'id -un')
          echo "image runs as: $user"
          [ "$user" != "root" ] || { echo "::error::image runs as root"; exit 1; }

      - name: Stop container
        if: always()
        run: docker rm -f salesiq-ci || true
